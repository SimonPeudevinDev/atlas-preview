  <meta name="theme-color" content="#F6F2EA">
  <script>
    /* Thème avant tout affichage (pas de flash) : choix enregistré, sinon celui du téléphone */
    (function () { try { var t = localStorage.getItem('atlas-theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); if (t === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#12100D'); } catch (e) { /* ignore */ } })();
  </script>

  <!-- Filtres partagés par toutes les illustrations SVG -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="atl-wc" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="atl-blur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="12"/>
      </filter>
    </defs>
  </svg>
